org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Project lives under a path with Turkish characters (Ö, ç, ü).
android.overridePathCheck=true
# Kotlin incremental caches break when the same sources are seen via the junction
# (C:\Users\Public\TesadufBuild) and the real path; always compile fully.
kotlin.incremental=false
